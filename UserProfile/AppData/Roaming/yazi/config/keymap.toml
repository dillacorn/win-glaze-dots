# github.com/dillacorn/win-glaze-dots
# %APPDATA%\yazi\config\keymap.toml
# Adapted from the Awtarchy Yazi keymap, without Linux-only dragon-drop bindings.

[mgr]
prepend_keymap = [
  # Movement
  { on = ["<Up>"],    run = 'lua "WgdotYaziArrow(-1)"', desc = "Up" },
  { on = ["<Down>"],  run = 'lua "WgdotYaziArrow(1)"', desc = "Down" },
  { on = ["k"],       run = 'lua "WgdotYaziArrow(-1)"', desc = "Up" },
  { on = ["j"],       run = 'lua "WgdotYaziArrow(1)"', desc = "Down" },
  { on = ["g", "g"], run = "arrow top", desc = "Top" },
  { on = ["G"],       run = "arrow bot", desc = "Bottom" },

  # Enter/leave
  { on = ["<Right>"], run = 'lua "WgdotYaziRight()"', desc = "Enter directory or maximize file preview" },
  { on = ["l"],       run = "enter",     desc = "Enter directory" },
  { on = ["<Enter>"], run = 'lua "WgdotYaziSmartEnter()"', desc = "Enter directory or open file" },
  { on = ["<Esc>"],   run = 'lua "WgdotYaziEscape()"', desc = "Cancel active state, then clear selection" },
  { on = ["q"],       run = 'lua "WgdotYaziConfirmQuit(false)"', desc = "Quit with confirmation" },
  { on = ["Q"],       run = 'lua "WgdotYaziConfirmQuit(true)"', desc = "Quit without cwd file (confirm)" },
  { on = ["<C-w>"],   run = 'lua "WgdotYaziCloseTab()"', desc = "Close tab (confirm if last)" },
  { on = ["<C-t>"],   run = "tab_create --current", desc = "Create tab in current directory" },
  { on = ["<C-1>"],   run = "tab_switch 0", desc = "Switch to tab 1" },
  { on = ["<C-2>"],   run = "tab_switch 1", desc = "Switch to tab 2" },
  { on = ["<C-3>"],   run = "tab_switch 2", desc = "Switch to tab 3" },
  { on = ["<C-4>"],   run = "tab_switch 3", desc = "Switch to tab 4" },
  { on = ["<C-5>"],   run = "tab_switch 4", desc = "Switch to tab 5" },
  { on = ["<C-6>"],   run = "tab_switch 5", desc = "Switch to tab 6" },
  { on = ["<C-7>"],   run = "tab_switch 6", desc = "Switch to tab 7" },
  { on = ["<C-8>"],   run = "tab_switch 7", desc = "Switch to tab 8" },
  { on = ["<C-9>"],   run = "tab_switch 8", desc = "Switch to tab 9" },
  { on = ["<Left>"],  run = 'lua "WgdotYaziLeft()"', desc = "Restore preview or go up one dir" },
  { on = ["h"],       run = "leave",     desc = "Up one dir" },
  { on = ["<Backspace>"], run = "leave", desc = "Up one dir" },

  # History / navigation
  { on = ["H"],       run = "back",      desc = "Back in history" },
  { on = ["L"],       run = "forward",   desc = "Forward in history" },
  { on = ["b"],       run = 'lua "WgdotYaziToggleBookmarks()"', desc = "Toggle bookmarks" },
  { on = ["B"],       run = 'lua "WgdotYaziBookmarkHovered()"', desc = "Bookmark/unbookmark highlighted item" },
  { on = ["r"],       run = 'lua "WgdotYaziToggleRecents()"', desc = "Toggle recent files" },
  { on = ["g", "r"], run = 'lua "WgdotYaziGoRecents()"', desc = "Go to recently opened folder" },
  { on = ["g", "b"], run = 'lua "WgdotYaziGoBookmarks()"', desc = "Go to bookmarked folder" },
  { on = ["g", "m"], run = "plugin drives", desc = "Open Windows drive picker" },
  { on = ["<C-f>"],  run = 'lua "WgdotYaziSearchMenu()"', desc = "Search current directory tree" },

  # Selection
  { on = ["<Space>"],   run = 'lua "WgdotYaziSpace()"', desc = "Confirm Shift range or toggle selection" },
  { on = ["<C-Space>"], run = "toggle", desc = "Toggle individual selection" },
  { on = ["<S-Up>"],    run = 'lua "WgdotYaziShiftArrow(-1)"', desc = "Preview range up (Space confirms, Esc cancels)" },
  { on = ["<S-Down>"],  run = 'lua "WgdotYaziShiftArrow(1)"', desc = "Preview range down (Space confirms, Esc cancels)" },
  { on = ["v"],         run = "visual_mode", desc = "Visual select mode" },
  { on = ["<C-a>"],     run = "toggle_all", desc = "Select all / invert selection" },

  # Copy/Cut/Paste
  { on = ["y"],       run = 'lua "WgdotYaziYank()"', desc = "Yank (copy) or confirm trash" },
  { on = ["D"],       run = 'lua "WgdotYaziPermanentDelete()"', desc = "Permanently delete selection" },
  { on = ["Y"],       run = "yank --cut", desc = "Yank (cut)" },
  { on = ["p"],       run = "paste",      desc = "Paste" },
  { on = ["<C-c>"],   run = ["yank", "plugin system-clipboard"], desc = "Copy file(s) to Windows clipboard" },
  { on = ["<C-x>"],   run = "yank --cut", desc = "Cut selected files" },
  { on = ["<C-v>"],   run = "paste",      desc = "Paste copied/cut files" },
  { on = ["c", "y"],  run = ["yank", "plugin system-clipboard"], desc = "Copy file(s) to Windows clipboard" },
  { on = ["c", "z"], run = 'lua "WgdotYaziCompressSelection()"', desc = "Compress selection to ZIP" },
  { on = ["e", "h"], run = 'lua "WgdotYaziExtractZipHere()"', desc = "Extract ZIP here" },
  { on = ["e", "f"], run = 'lua "WgdotYaziExtractZipFolder()"', desc = "Extract ZIP to folder" },

  # File ops
  # Creation/search stay on Yazi defaults: a=create, /=find, n/N=next/previous match.
  { on = ["o"],       run = 'lua "WgdotYaziOpen(false)"', desc = "Open selected files" },
  { on = ["O"],       run = 'lua "WgdotYaziOpen(true)"', desc = "Open selected files interactively" },
  { on = ["<S-Enter>"], run = 'lua "WgdotYaziOpen(true)"', desc = "Open selected files interactively" },
  { on = ["d", "g"], run = 'lua "WgdotYaziDragOut()"', desc = "Drag selected file(s) out" },
  { on = ["d", "p"], run = 'lua "WgdotYaziDropToParent()"', desc = "Copy or move selection to parent directory" },
  { on = ["R"],       run = 'lua "WgdotYaziRename(false)"', desc = "Rename (native terminal text selection)" },
  { on = ["<F2>"],    run = 'lua "WgdotYaziRename(false)"', desc = "Rename (native terminal text selection)" },
  { on = ["d", "d"], run = 'lua "WgdotYaziRemoveMenu()"', desc = "Trash or permanently delete selection" },
  { on = ["<Delete>"], run = 'lua "WgdotYaziRemoveMenu()"', desc = "Trash or permanently delete selection" },
  { on = ["t", "e"], run = "shell --orphan -- wt.exe -w new new-tab -d .", desc = "Open terminal here" },
  { on = ["t", "n"], run = 'lua "WgdotYaziOpenHoveredTab()"', desc = "Open hovered folder in new tab" },

  # Display
  { on = ["i"],       run = "spot", desc = "Toggle file information" },
  { on = ["m", "t"], run = 'lua "WgdotYaziToggleTimeFormat()"', desc = "Toggle modified time 24h/12h" },
  { on = ["m", "v"], run = 'lua "WgdotYaziTogglePreview()"', desc = "Toggle preview pane" },
  { on = ["m", "x"], run = 'lua "WgdotYaziTogglePreviewMax()"', desc = "Maximize/restore preview" },
  { on = ["m", "c"], run = 'lua "WgdotYaziSelectPreviewText()"', desc = "Select/copy highlighted text file" },

  # Help
  { on = ["?"],       run = "help",       desc = "Help" }
]

[input]
prepend_keymap = [
  { on = ["<Esc>"], run = ['lua "WgdotYaziRenameRestoreMouse()"', "close"], desc = "Cancel input" },
  { on = ["<Enter>"], run = ['lua "WgdotYaziRenameRestoreMouse()"', "close --submit"], desc = "Submit input" },
  { on = ["<C-[>"], run = ['lua "WgdotYaziRenameRestoreMouse()"', "escape"], desc = "Input mode escape" },
  { on = ["<C-a>"], run = ["move eol", "visual", "move bol"], desc = "Highlight all input text" },
  { on = ["<C-c>"], run = "yank", desc = "Copy highlighted input text" }
]

[confirm]
prepend_keymap = [
  { on = ["<Space>"], run = "close --submit", desc = "Confirm" },
  { on = ["Y"],       run = "close --submit", desc = "Confirm" },
  { on = ["N"],       run = "close",          desc = "Cancel" }
]

[spot]
prepend_keymap = [
  { on = ["i"], run = "close", desc = "Close file information" }
]

[help]
append_keymap = [
  { on = ["q"], run = "close", desc = "Close help" }
]
