      - commands: ["shell-exec calc.exe"]
        bindings: ["lwin+alt+c", "rwin+alt+c"]

      - commands: ["shell-exec flameshot.exe gui"]
        bindings: ["lwin+alt+s", "rwin+alt+s"]

      - commands: ["shell-exec wt.exe -w new"]
        bindings: ["lwin+alt+enter", "rwin+alt+enter"]

      - commands: ["focus --workspace 1"]
        bindings: ["lwin+alt+1", "rwin+alt+1"]
      - commands: ["focus --workspace 2"]
