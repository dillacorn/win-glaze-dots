  - commands: ["focus --direction right"]
    bindings: ["alt+l", "alt+right", "lwin+right", "rwin+right"]
  - commands: ["focus --direction up"]
    bindings: ["alt+k", "alt+up", "lwin+k", "rwin+k", "lwin+up", "rwin+up"]
  - commands: ["focus --direction down"]
    bindings: ["alt+j", "alt+down", "lwin+j", "rwin+j", "lwin+down", "rwin+down"]

  - commands: ["move --direction left"]
    bindings: ["alt+shift+h", "alt+shift+left", "lwin+shift+h", "rwin+shift+h", "lwin+shift+left", "rwin+shift+left"]
  - commands: ["move --direction right"]
    bindings: ["alt+shift+l", "alt+shift+right", "lwin+shift+l", "rwin+shift+l", "lwin+shift+right", "rwin+shift+right"]
  - commands: ["move --direction up"]
    bindings: ["alt+shift+k", "alt+shift+up", "lwin+shift+k", "rwin+shift+k", "lwin+shift+up", "rwin+shift+up"]
  - commands: ["move --direction down"]
    bindings: ["alt+shift+j", "alt+shift+down", "lwin+shift+j", "rwin+shift+j", "lwin+shift+down", "rwin+shift+down"]

  - commands: ["resize --width -2%"]
    bindings: ["alt+y", "alt+ctrl+right"]
  - commands: ["resize --width +2%"]
    bindings: ["alt+o", "alt+ctrl+left"]
  - commands: ["resize --height +2%"]
    bindings: ["alt+i", "alt+ctrl+up"]
  - commands: ["resize --height -2%"]
    bindings: ["alt+u", "alt+ctrl+down"]

  - commands: ["wm-enable-binding-mode --name noalt"]
    bindings: ["lwin+alt+n", "rwin+alt+n"]

  - commands: ["wm-enable-binding-mode --name vm"]
