  - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe clipboard-anchor hotkey']
    bindings: ["lwin+c", "rwin+c"]

  # Real GlazeWM pause. While paused, GlazeWM intentionally keeps only
  # wm-toggle-pause bindings active, so this same key always unpauses.
  - commands: ["wm-toggle-pause"]
    bindings: ["lwin+alt+p", "rwin+alt+p"]

  - commands: ["toggle-tiling-direction"]
    bindings: ["alt+shift+r"]

  - commands: ["toggle-floating --centered"]
    bindings: ["alt+f", "lwin+f", "rwin+f"]

  - commands: ["toggle-tiling"]
    bindings: ["alt+t", "lwin+t", "rwin+t"]

  - commands:
      - "toggle-fullscreen"
      - "shell-exec --hide-window powershell -NoProfile -WindowStyle Hidden -Command \"Start-Sleep -Milliseconds 70; Start-Process -WindowStyle Hidden glazewm -ArgumentList 'command wm-redraw'\""
