      - commands: ["focus --workspace 9"]
        bindings: ["lwin+alt+9", "rwin+alt+9"]
      - commands: ["focus --workspace 10"]
        bindings: ["lwin+alt+0", "rwin+alt+0"]

      - commands: ["move --workspace 1"]
        bindings: ["lwin+alt+shift+1", "rwin+alt+shift+1"]
      - commands: ["move --workspace 2"]
        bindings: ["lwin+alt+shift+2", "rwin+alt+shift+2"]
