  - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe theme-window-toggle']
    bindings: ["lwin+alt+t", "rwin+alt+t"]

  - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe power-menu']
    bindings: ["lwin+p", "rwin+p"]
  # Compiled WGDot coordinates YASB auto-hide with the GlazeWM top gap.
  - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe bar-autohide-toggle']
    bindings: ["alt+ctrl+b"]

  - commands: ["shell-exec C:\\Program Files (x86)\\SpeedCrunch\\speedcrunch.exe"]
