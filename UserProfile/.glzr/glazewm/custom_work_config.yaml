keybindings:

  - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe launcher hotkey']
    bindings: ["alt+p", "lwin+d", "rwin+d"]



  - commands: ["shell-exec flameshot.exe gui"]
    bindings: ["lwin+shift+s", "rwin+shift+s"]

  - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe rawaccel-toggle']
