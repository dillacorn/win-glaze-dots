# dilla.glaze.files (https://github.com/dillacorn/win-glaze-dots)
# This config is my personalized config I use specifically for my work computer.
# change file name to config.yaml and delete adjacent config.yaml files to use this config within the folder.
# config.yaml (GlazeWM) - work config
general:
  startup_commands:
    - "shell-exec yasb"

  shutdown_commands: ["shell-exec taskkill /IM yasb.exe /F"]
  config_reload_commands: []

  focus_follows_cursor: false
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: "monitor_focus"

  hide_method: "cloak"
  show_all_in_taskbar: true

gaps:
  scale_with_dpi: true
  inner_gap: "5px"
  outer_gap:
    top: "35px"
    right: "3px"
    bottom: "5px"
    left: "3px"

window_effects:
  focused_window:
    border:
      enabled: true
      # Theme-neutral on purpose. YASB themes update live without reloading
      # GlazeWM, preserving the current tiling/layout state.
      color: "#a1a1a1"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: "square"
    transparency:
      enabled: false
      opacity: "95%"
  other_windows:
    border:
      enabled: false
      color: "#a1a1a1"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: "square"
    transparency:
      enabled: false
      opacity: "95%"

window_behavior:
  initial_state: "tiling"
  state_defaults:
    floating:
      centered: false
      shown_on_top: true
    fullscreen:
      maximized: true
      shown_on_top: true

workspaces:
  - name: "1"
    display_name: "1: CHATS"
  - name: "2"
    display_name: "2: WORK"
  - name: "3"
    display_name: "3: MAIL"
  - name: "4"
    display_name: "4: FILES"
  - name: "5"
    display_name: "5: HTTP"
  - name: "6"
    display_name: "6: OFFICE"
  - name: "7"
    display_name: "7: PDF"
  - name: "8"
    display_name: "8:    "
  - name: "9"
    display_name: "9:    "
  - name: "10"
    display_name: "10:   "

window_rules:
  # HARD IGNORE: GlazeWM must not manage Civil 3D at all.
  - commands: ["ignore"]
    match:
      - window_process: { regex: "^(acad|acadlt)(\\.exe)?$" }

  - commands: ["move --workspace 1"]
    match:
      - window_process: { regex: "ms-teams" }

  - commands: ["move --workspace 3"]
    match:
      - window_process: { regex: "OUTLOOK|olk" }

  - commands: ["move --workspace 4"]
    match:
      - window_process: { regex: "dopus|explorer" }
      - window_process: { regex: "^WindowsTerminal(\\.exe)?$" }
        window_title: { regex: "^Yazi$" }

  - commands: ["move --workspace 5"]
    match:
      - window_process: { regex: "librewolf|firefox|chrome|brave" }

  - commands: ["move --workspace 6"]
    match:
      - window_process: { regex: "WINWORD|EXCEL|MSPUB|MSACCESS|soffice|wordpad" }

  - commands: ["move --workspace 7"]
    match:
      - window_process: { regex: "PDFXEdit|SumatraPDF|okular|pdfeditor|Acrobat|Revu" }

  - commands: ["ignore"]
    match:
      # Windows Applications
      - window_process: { equals: "windhawk" }

      # Ignore rules for Window Manager apps
      - window_process: { equals: "zebar" }
      - window_process: { equals: "yasb" }
      - window_process: { equals: "Flow.Launcher" }
      - window_process: { equals: "AltSnap" }
      - window_process: { equals: "flameshot" }
      - window_process: { equals: "LiveCaptions" }

      # Ignore rule for picture-in-picture windows in browsers.
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: "PowerToys" }
        window_class: { regex: "HwndWrapper\\[PowerToys\\.PowerAccent.*?\\]" }
      - window_process: { equals: "PowerToys" }
        window_title: { regex: ".*? - Peek" }
      - window_process: { equals: "Lively" }
        window_class: { regex: "HwndWrapper" }
      - window_process: { equals: "Mullvad VPN" }
      - window_process: { equals: "ui32" }
      - window_process: { equals: "wallpaper32" }
      - window_process: { equals: "wallpaper64" }

      # Ignore Windows Input Experience (Civil 3D popups)
      - window_process: { equals: "TextInputHost" }
      - window_process: { equals: "Windows Input Experience" }

      # Autodesk related background processes
      - window_process: { regex: "^(ADPClientService|AdskAccessUIHost|AdskAccessCore|AdSSO|AdskIdentityManager)$" }

      # Ignore rules for Work monitoring applications
      - window_process: { equals: "LTSVC" }
      - window_process: { equals: "LTSvcMon" }
      - window_process: { equals: "LTTray" }

  - commands: ["set-floating"]
    match:
      - window_process: { equals: "Taskmgr" }
      - window_process: { equals: "speedcrunch" }
      - window_process: { equals: "winspy" }
      - window_process: { equals: "localsend_app" }
      - window_process: { equals: "RustDesk" }
        window_class: { regex: "^(TfcSearchForm)$" }
      - window_process: { equals: "ApplicationFrameHost" }

      # Bluebeam Revu
      - window_title: { regex: "^Insert Pages$" }

  - commands: ["set-floating --centered"]
    match:
      - window_title: { regex: "Volume Mixer" }
      - window_process: { equals: "EarTrumpet" }
      - window_title: { regex: "(Find|Replace)" }
      # Keep the standalone theme selector out of the tiling tree. Its terminal
      # title is fixed with Windows Terminal --suppressApplicationTitle.
      - window_process: { regex: "^WindowsTerminal(\\.exe)?$" }
        window_title: { equals: "Win Glaze Themes" }

binding_modes:
  - name: "resize"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["l", "right"]
      - commands: ["resize --width +2%"]
        bindings: ["h", "left"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter"]
      - commands: ["wm-toggle-pause"]
        bindings: ["lwin+alt+p", "rwin+alt+p"]

  # Gaming-friendly mode based on Awtarchy's noalt submap.
  # Normal Alt-heavy bindings are replaced with Super equivalents while active.
  # Workspace focus/move is explicitly duplicated because GlazeWM binding modes
  # do not inherit global bindings.
  - name: "noalt"
    keybindings:
      - commands: ["wm-disable-binding-mode --name noalt"]
        bindings: ["lwin+alt+n", "rwin+alt+n"]
      - commands:
          - "wm-disable-binding-mode --name noalt"
          - "wm-enable-binding-mode --name vm"
        bindings: ["lwin+alt+v", "rwin+alt+v"]
      - commands: ["wm-toggle-pause"]
        bindings: ["lwin+alt+p", "rwin+alt+p"]
      - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe power-menu']
        bindings: ["lwin+p", "rwin+p"]
      - commands: ['shell-exec explorer.exe "shell:AppsFolder\40459File-New-Project.EarTrumpet_1sdd7yawvg6ne!EarTrumpet"']
        bindings: ["lwin+v", "rwin+v"]
      - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe clipboard-anchor hotkey']
        bindings: ["lwin+c", "rwin+c"]
      - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe bar-autohide-toggle']
        bindings: ["alt+ctrl+b"]
      - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe launcher hotkey']
        bindings: ["lwin+d", "rwin+d"]
      - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe theme-window-toggle']
        bindings: ["lwin+alt+t", "rwin+alt+t"]
      - commands: ["toggle-tiling"]
        bindings: ["lwin+t", "rwin+t"]
      - commands: ["shell-exec explorer.exe ms-settings:display"]
        bindings: ["lwin+ctrl+m", "rwin+ctrl+m"]
      - commands: ["shell-exec flameshot.exe gui"]
        bindings: ["lwin+shift+s", "rwin+shift+s"]
      - commands: ['shell-exec %LOCALAPPDATA%\\wgdot\\bin\\wgdotw.exe rawaccel-toggle']
        bindings: ["lwin+shift+m", "rwin+shift+m"]
      - commands: ["shell-exec wt.exe -w new"]
        bindings: ["lwin+enter", "rwin+enter", "lwin+shift+enter", "rwin+shift+enter"]
      - commands: ["shell-exec wt.exe -w new new-tab --title \"Yazi\" --suppressApplicationTitle powershell.exe -NoProfile -NoLogo -NoExit -Command yazi"]
        bindings: ["lwin+shift+e", "rwin+shift+e"]
      - commands: ["shell-exec explorer.exe http:"]
        bindings: ["lwin+b", "rwin+b"]
      - commands: ["shell-exec C:\\Program Files (x86)\\SpeedCrunch\\speedcrunch.exe"]
        bindings: ["lwin+shift+c", "rwin+shift+c"]

      - commands: ["close"]
        bindings: ["lwin+q", "rwin+q", "lwin+shift+q", "rwin+shift+q"]
      - commands: ["toggle-floating --centered"]
        bindings: ["lwin+f", "rwin+f"]
      - commands: ["toggle-fullscreen"]
        bindings: ["lwin+ctrl+f", "rwin+ctrl+f"]

      - commands: ["focus --direction left"]
        bindings: ["lwin+h", "rwin+h", "lwin+left", "rwin+left"]
      - commands: ["focus --direction right"]
        bindings: ["lwin+right", "rwin+right"]
      - commands: ["focus --direction up"]
        bindings: ["lwin+k", "rwin+k", "lwin+up", "rwin+up"]
      - commands: ["focus --direction down"]
        bindings: ["lwin+j", "rwin+j", "lwin+down", "rwin+down"]

      - commands: ["move --direction left"]
        bindings: ["lwin+shift+h", "rwin+shift+h", "lwin+shift+left", "rwin+shift+left"]
      - commands: ["move --direction right"]
        bindings: ["lwin+shift+l", "rwin+shift+l", "lwin+shift+right", "rwin+shift+right"]
      - commands: ["move --direction up"]
        bindings: ["lwin+shift+k", "rwin+shift+k", "lwin+shift+up", "rwin+shift+up"]
      - commands: ["move --direction down"]
        bindings: ["lwin+shift+j", "rwin+shift+j", "lwin+shift+down", "rwin+shift+down"]

      - commands: ["focus --workspace 1"]
        bindings: ["lwin+1", "rwin+1"]
      - commands: ["focus --workspace 2"]
        bindings: ["lwin+2", "rwin+2"]
      - commands: ["focus --workspace 3"]
        bindings: ["lwin+3", "rwin+3"]
      - commands: ["focus --workspace 4"]
        bindings: ["lwin+4", "rwin+4"]
      - commands: ["focus --workspace 5"]
        bindings: ["lwin+5", "rwin+5"]
      - commands: ["focus --workspace 6"]
        bindings: ["lwin+6", "rwin+6"]
      - commands: ["focus --workspace 7"]
        bindings: ["lwin+7", "rwin+7"]
      - commands: ["focus --workspace 8"]
        bindings: ["lwin+8", "rwin+8"]
      - commands: ["focus --workspace 9"]
        bindings: ["lwin+9", "rwin+9"]
      - commands: ["focus --workspace 10"]
        bindings: ["lwin+0", "rwin+0"]

      - commands: ["move --workspace 1"]
        bindings: ["lwin+shift+1", "rwin+shift+1"]
      - commands: ["move --workspace 2"]
        bindings: ["lwin+shift+2", "rwin+shift+2"]
      - commands: ["move --workspace 3"]
        bindings: ["lwin+shift+3", "rwin+shift+3"]
      - commands: ["move --workspace 4"]
        bindings: ["lwin+shift+4", "rwin+shift+4"]
      - commands: ["move --workspace 5"]
        bindings: ["lwin+shift+5", "rwin+shift+5"]
      - commands: ["move --workspace 6"]
        bindings: ["lwin+shift+6", "rwin+shift+6"]
      - commands: ["move --workspace 7"]
        bindings: ["lwin+shift+7", "rwin+shift+7"]
      - commands: ["move --workspace 8"]
        bindings: ["lwin+shift+8", "rwin+shift+8"]
      - commands: ["move --workspace 9"]
        bindings: ["lwin+shift+9", "rwin+shift+9"]
      - commands: ["move --workspace 10"]
        bindings: ["lwin+shift+0", "rwin+shift+0"]


  # VM mode based on Awtarchy's vm submap.
  # Normal host keybindings are replaced while active so the guest receives
  # ordinary Alt/Windows shortcuts. Host escape controls live on Win+Alt.
  - name: "vm"
    keybindings:
      - commands: ["wm-disable-binding-mode --name vm"]
        bindings: ["lwin+alt+v", "rwin+alt+v"]
      - commands:
          - "wm-disable-binding-mode --name vm"
          - "wm-enable-binding-mode --name noalt"
        bindings: ["lwin+alt+n", "rwin+alt+n"]
      - commands: ["wm-toggle-pause"]
        bindings: ["lwin+alt+p", "rwin+alt+p"]

      - commands: ["close"]
