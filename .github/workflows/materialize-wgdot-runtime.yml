name: Materialize WGDot sources

on:
  push:
    branches:
      - feature/wgdot-maintenance
    paths:
      - "AGENTS.md.gz"
      - "MANUAL_POWERSHELL.md.gz"
      - "wgdot/manifest.json.gz"
      - "tests/test-wgdot.ps1.gz"
      - ".github/workflows/materialize-wgdot-runtime.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize sources
        run: |
          gzip -dc AGENTS.md.gz > AGENTS.md
          gzip -dc MANUAL_POWERSHELL.md.gz > MANUAL_POWERSHELL.md
          gzip -dc wgdot/manifest.json.gz > wgdot/manifest.json
          gzip -dc tests/test-wgdot.ps1.gz > tests/test-wgdot.ps1
          rm AGENTS.md.gz MANUAL_POWERSHELL.md.gz wgdot/manifest.json.gz tests/test-wgdot.ps1.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add WGDot sources and tests"
          git push origin HEAD:${GITHUB_REF_NAME}
