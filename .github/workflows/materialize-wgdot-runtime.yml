name: Materialize WGDot runtime

on:
  push:
    branches:
      - feature/wgdot-maintenance
    paths:
      - "wgdot/wgdot.ps1.gz"
      - ".github/workflows/materialize-wgdot-runtime.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize runtime
        run: |
          gzip -dc wgdot/wgdot.ps1.gz > wgdot/wgdot.ps1
          rm wgdot/wgdot.ps1.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wgdot/wgdot.ps1 wgdot/wgdot.ps1.gz
          git commit -m "Add WGDot runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
