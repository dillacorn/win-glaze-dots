name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  one-use-wgdot-v480-pause-replacement:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'ONE-USE WGDot v4.8.0 Pause Replacement Publisher' &&
      github.event.pull_request.head.ref == 'release-bridge/wgdot-v4.8.0-pause-replace' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == 'fcc2c09242ff7213e4dd0657613a8713087b2e6d'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Guard exact approved old and new release targets
        shell: bash
        run: |
          set -euo pipefail
          expected_main='fcc2c09242ff7213e4dd0657613a8713087b2e6d'
          expected_old='59b244bc5d8c874241575624e6441bc758b564d7'
          actual_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$actual_main" != "$expected_main" ]; then
            echo "Main advanced unexpectedly: $actual_main" >&2
            exit 1
          fi
          old_release_target="$(gh release view v4.8.0 --json targetCommitish --jq '.targetCommitish')"
          old_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v4.8.0" --jq '.object.sha')"
          if [ "$old_release_target" != "$expected_old" ] || [ "$old_tag_sha" != "$expected_old" ]; then
            echo "Existing v4.8.0 has changed; refusing to delete or replace it" >&2
            exit 1
          fi

      - name: Delete old v4.8.0 and publish tested pause replacement
        shell: bash
        run: |
          set -euo pipefail
          tag='v4.8.0'
          target='fcc2c09242ff7213e4dd0657613a8713087b2e6d'
          title='WGDot v4.8.0 Yazi Editing and GlazeWM Pause'
          notes="$RUNNER_TEMP/wgdot-v480-pause-notes.md"
          cat > "$notes" <<'NOTES'
          # WGDot v4.8.0 Yazi Editing and GlazeWM Pause

          This minor release improves Yazi text editing and gives GlazeWM pause a visible, clickable indicator in YASB.

          ## Install and update

          - [Install](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)
          - [Update](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)

          ## Yazi

          - Ctrl+A selects the complete input field. Backspace or Delete removes the current selection in one press.
          - Plain Left/Right, Ctrl+Left/Right, and Home/End cancel any previous selection before moving the caret.
          - Ctrl+Z restores accidentally deleted text in an open rename, tab-name, or creation prompt.
          - Ctrl+T creates a new tab using its folder's automatic name instead of copying the source tab's custom name.

          ## GlazeWM and YASB

          - Both Normal and Work bar profiles show an icon and **Paused** text beside the tiling-direction indicator only while GlazeWM reports its actual pause state.
          - Click **Paused** to resume GlazeWM via its native `wm-toggle-pause` command. The existing Super+Alt+P shortcut remains available.
          - YASB uses the native GlazeWM CLI, without a resident WGDot pause helper or PowerShell script.

          ## Known limitation

          - Reversing Ctrl+Shift+Left/Right during word selection may include one adjacent character; see [issue #118](https://github.com/dillacorn/win-glaze-dots/issues/118).

          ## Validation

          - All four WGDot validation jobs passed for Yazi PR #120 and the GlazeWM pause-indicator PR #117, covering YASB stable schemas, Windows PowerShell 5.1/7, and native bootstrap.
          - The maintainer confirmed Yazi Ctrl+Z text undo on Windows. The new YASB pause-indicator visibility and click action still require an interactive Windows check.
          NOTES
          gh release delete "$tag" --yes --cleanup-tag
          for i in $(seq 1 15); do
            if ! gh release view "$tag" >/dev/null 2>&1 &&
               ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if gh release view "$tag" >/dev/null 2>&1 ||
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Old release or tag still present; not replacing until deletion settles" >&2
            exit 1
          fi
          gh release create "$tag" --target "$target" --title "$title" --notes-file "$notes" --latest
          released="$(gh release view "$tag" --json tagName,name,isDraft,isPrerelease,targetCommitish,body,url)"
          if [ "$(printf '%s' "$released" | jq -r '.isDraft')" = true ]; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false >/dev/null
            released="$(gh release view "$tag" --json tagName,name,isDraft,isPrerelease,targetCommitish,body,url)"
          fi
          printf '%s' "$released" | jq -e --arg tag "$tag" --arg title "$title" --arg target "$target" '
            .tagName == $tag and .name == $title and
            .isDraft == false and .isPrerelease == false and .targetCommitish == $target
          '
          test "$(printf '%s' "$released" | jq -r '.body')" = "$(cat "$notes")"
          obj_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          obj_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')"
          if [ "$obj_type" = tag ]; then
            obj_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.object.sha')"
          fi
          if [ "$obj_sha" != "$target" ]; then
            echo "Replacement release tag points to wrong commit: $obj_sha" >&2
            exit 1
          fi
          printf 'VERIFIED REPLACEMENT: %s\n' "$(printf '%s' "$released" | jq -r '.url')"

      - name: Remove one-use publishing branch
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release-bridge/wgdot-v4.8.0-pause-replace"
          echo "Temporary release bridge branch deleted; main unchanged."

