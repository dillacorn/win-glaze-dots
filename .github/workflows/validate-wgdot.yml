name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          lua5.4 tests/test-yazi-tab-workspaces.lua
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  publish-wgdot-v4-8-1-once:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'chore: publish WGDot v4.8.1 (one-use bridge)' &&
      github.event.pull_request.head.ref == 'release-bridge-v4-8-1-4e444050' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'dillacorn/win-glaze-dots'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: 'dillacorn/win-glaze-dots'
      TAG: 'v4.8.1'
      TARGET_SHA: '4e444050a667395673efaf1643c513574c093c83'
      BRIDGE_BRANCH: 'release-bridge-v4-8-1-4e444050'
    steps:
      - name: Verify target and publish immutable-versioned WGDot release
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$TARGET_SHA" || { echo "main SHA changed; refusing publication"; exit 1; }
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"; exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to move it"; exit 1
          fi
          printf '%s\n' \
            '# WGDot v4.8.1 Yazi Tab Groups and Pinning' \
            '' \
            'This patch release introduces saved Yazi tab sessions, persistent pins, session-only Quick Mark navigation, and streamlined shortcuts.' \
            '' \
            '## Install and update' \
            '' \
            '- [Install](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)' \
            '- [Update](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)' \
            '' \
            '## Yazi' \
            '' \
            '- Save named tab groups with `t s`; browse or toggle Saved Tab Groups and return to the previous directory with `t g` or `T`. Loading a group restores tab directories, order, custom names, and active tab without adding a blank tab.' \
            '- Pin or unpin the focused tab with `t p` or any hovered tab with right-click, without changing focus. A monochrome pin symbol inherits the tab-title text color. Pins persist across Yazi restarts; suspended pins remain saved when a loaded group fills the nine-tab limit.' \
            '- Rename tabs with `t r` near the tab bar. Closing a pinned tab offers a choice to retain its pin for future sessions or unpin it.' \
            '- Press `q q` to mark a temporary directory; `Q` toggles between it and the previous location; `g q` jumps to it. Quit confirmation remains under `q`, and quit without cwd file under `g Q`.' \
            '- `r` renames the highlighted item, `R` toggles Recents, `b` bookmarks/unbookmarks the highlighted item, and `B` toggles Bookmarks. `F2` remains available for rename.' \
            '' \
            '## Validation' \
            '' \
            '- All four WGDot validation jobs passed on Yazi PR #127, including Lua syntax/behavior, Windows PowerShell 5.1/7, and native bootstrap.' \
            '- The maintainer confirmed working Windows Yazi behavior, including inactive-tab right-click pin/unpin and the tested feature checklist. Issues #118 and #119 remain separate where applicable.' > "$RUNNER_TEMP/wgdot-v4.8.1.md"
          gh release create "$TAG" --repo "$REPO" --target "$TARGET_SHA" \
            --title 'WGDot v4.8.1 Yazi Tab Groups and Pinning' \
            --notes-file "$RUNNER_TEMP/wgdot-v4.8.1.md" --latest
          gh api "repos/$REPO/releases/tags/$TAG" > "$RUNNER_TEMP/published-release.json"
          python3 -c 'import json,os,pathlib; r=json.load(open(os.environ["RUNNER_TEMP"]+"/published-release.json",encoding="utf-8")); notes=pathlib.Path(os.environ["RUNNER_TEMP"]+"/wgdot-v4.8.1.md").read_text(encoding="utf-8"); assert r["tag_name"]=="v4.8.1"; assert r["name"]=="WGDot v4.8.1 Yazi Tab Groups and Pinning"; assert r["target_commitish"]==os.environ["TARGET_SHA"]; assert r["draft"] is False and r["prerelease"] is False; assert r["body"].rstrip("\n")==notes.rstrip("\n"), "release body mismatch"; print("Verified release title, notes, SHA, draft and prerelease state")'
          tag_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$TARGET_SHA" || { echo "Tag points at incorrect commit: $tag_sha"; exit 1; }
          echo "Confirmed $TAG points at $TARGET_SHA"
      - name: Remove temporary one-use workflow branch
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRIDGE_BRANCH"
          echo 'Temporary publishing branch removed'
