name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  publish-wgdot-v4-7-6-once:
    name: Publish WGDot v4.7.6 exactly once
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.title == 'ONE-USE WGDot v4.7.6 release bridge (DO NOT MERGE)' &&
      github.event.pull_request.head.ref == 'release-bridge/wgdot-v4.7.6-4568107' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'dillacorn/win-glaze-dots'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify target and publish immutable patch release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: '4568107102f1057fe3017cc390f2ccb174a1fd2b'
          RELEASE_NOTES: |
            # WGDot v4.7.6 Application Launcher Improvements
            
            This patch release makes the WGDot application launcher more responsive and improves installed application discovery.
            
            ## Install and update
            
            - [Install](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)
            - [Update](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)
            
            ## Application launcher
            
            - Include Microsoft Store/MSIX applications such as ChatGPT alongside classic Start Menu shortcuts.
            - Cache application icons locally and preload them before results appear, preventing distracting late icon pop-in.
            - Improve cold-launch responsiveness by skipping maintenance-only initialization and avoid rescanning the installed-app catalog on every open.
            - Refresh the installed-app index asynchronously, with Ctrl+R available for an immediate refresh.
            
            ## Validation
            
            - All four WGDot CI jobs passed for launcher PR #115, including Windows native compilation/bootstrap, PowerShell 5.1/7, desktop integration, and native icon-cache tests.
            - The application launcher was tested on Windows, with ChatGPT discovery and improved responsiveness confirmed.
        run: |
          set -euo pipefail
          repository="$GITHUB_REPOSITORY"
          target="$(gh api "repos/$repository/branches/main" --jq '.commit.sha')"
          if [[ "$target" != "$EXPECTED_SHA" ]]; then
            echo 'The main branch moved; refusing to publish from the wrong revision.' >&2
            false
          fi
          if gh api "repos/$repository/git/ref/tags/v4.7.6" >/dev/null 2>&1; then
            echo 'Release tag v4.7.6 already exists; refusing to replace it.' >&2
            false
          fi
          if gh release view v4.7.6 --repo "$repository" >/dev/null 2>&1; then
            echo 'Release v4.7.6 already exists; refusing to replace it.' >&2
            false
          fi
          gh api "repos/$repository/contents/wgdot/manifest.json?ref=$EXPECTED_SHA" --jq '.content' | base64 -d | jq -e '.project == "win-glaze-dots"' >/dev/null
          notes_file="$RUNNER_TEMP/wgdot-v4.7.6-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          gh release create v4.7.6 --repo "$repository" --target "$EXPECTED_SHA" --title 'WGDot v4.7.6 Application Launcher Improvements' --notes-file "$notes_file" --latest
          release_json="$RUNNER_TEMP/wgdot-v4.7.6-release.json"
          gh api "repos/$repository/releases/tags/v4.7.6" > "$release_json"
          test "$(jq -r '.tag_name' "$release_json")" = 'v4.7.6'
          test "$(jq -r '.name' "$release_json")" = 'WGDot v4.7.6 Application Launcher Improvements'
          test "$(jq -r '.draft' "$release_json")" = 'false'
          test "$(jq -r '.prerelease' "$release_json")" = 'false'
          test "$(jq -r '.target_commitish' "$release_json")" = "$EXPECTED_SHA"
          test "$(jq -r '.body' "$release_json")" = "$(<"$notes_file")"
          tag_json="$RUNNER_TEMP/wgdot-v4.7.6-ref.json"
          gh api "repos/$repository/git/ref/tags/v4.7.6" > "$tag_json"
          tag_type="$(jq -r '.object.type' "$tag_json")"
          tag_sha="$(jq -r '.object.sha' "$tag_json")"
          if [[ "$tag_type" == 'tag' ]]; then
            tag_sha="$(gh api "repos/$repository/git/tags/$tag_sha" --jq '.object.sha')"
          fi
          test "$tag_sha" = "$EXPECTED_SHA"
          echo "Verified WGDot v4.7.6 at $EXPECTED_SHA"
