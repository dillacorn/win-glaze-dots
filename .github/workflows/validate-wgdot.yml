name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          lua5.4 tests/test-yazi-tab-workspaces.lua
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Defender scan of compiled WGDot when active
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'wgdot\bin\wgdot.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "No compiled runtime to scan: $exe"
          }
          $status = $null
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
          } catch {
            Write-Host "Defender check INCONCLUSIVE: status unavailable: $($_.Exception.Message)"
          }
          if ($null -eq $status -or
              $status.AMRunningMode -ne 'Normal' -or
              -not $status.AntivirusEnabled -or
              -not $status.RealTimeProtectionEnabled) {
            $result = 'INCONCLUSIVE: Defender real-time antivirus is not active on this runner.'
            Write-Warning $result
          } else {
            Write-Host "Defender real-time protection active. Scanning $exe"
            Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw 'Defender removed/quarantined the compiled WGDot runtime.'
            }
            $blocked = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
              (@($_.Resources) -join ' ') -like "*$exe*"
            })
            if ($blocked.Count -ne 0) {
              throw ('Defender detected the compiled WGDot runtime: ' +
                  (($blocked | Select-Object -ExpandProperty ThreatID) -join ', '))
            }
            $result = 'PASS: Defender on-demand scan of compiled WGDot found no detection on this runner.'
            Write-Host $result
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Defender scan: $result"
          }
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  release-v4-8-7-once:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.action == 'opened' &&
        github.event.pull_request.title == 'release-bridge: WGDot v4.8.7' &&
        github.event.pull_request.head.ref == 'chore/release-v4.8.7-power-menu' &&
        github.event.pull_request.head.repo.full_name == 'dillacorn/win-glaze-dots' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.base.sha == '559817bbe137b2094ddaf8aa9310cdc6723f6704'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish WGDot v4.8.7 from the exact approved main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dillacorn/win-glaze-dots
          RELEASE_SHA: 559817bbe137b2094ddaf8aa9310cdc6723f6704
        run: |
          set -euo pipefail
          release="v4.8.7"
          title="WGDot v4.8.7 Super+P Power Menu Focus Fix"
          actual_main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$actual_main" = "$RELEASE_SHA" || { echo "STOP: main moved"; exit 1; }
          if gh api "repos/$GH_REPO/git/ref/tags/$release" >/dev/null 2>&1; then
            echo "STOP: release tag already exists"; exit 1
          fi
          if gh release view "$release" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "STOP: release already exists"; exit 1
          fi
          notes="$RUNNER_TEMP/wgdot-v4.8.7-release.md"
          cat > "$notes" <<'WGDOT_RELEASE_NOTES'
          # WGDot v4.8.7 Super+P Power Menu Focus Fix

          This patch release improves power-menu focus when the Windows Start or Search surface interferes with Super+P.

          ## Install and update

          - [Install](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)
          - [Update](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)

          ## Power menu

          - Recover focus for the fullscreen power menu when Windows Start or Search appears above it after Super+P.
          - Restrict focus recovery to the hotkey; the YASB power button remains unchanged.
          - Avoid global hooks, suppressing the Windows key, or sending Escape to unrelated applications.
          - Report Microsoft Defender executable block/quarantine errors more clearly during Git-testing runtime updates.

          ## Validation and work-PC caution

          - All four Validate WGDot jobs passed on the merged main commit 559817bbe137b2094ddaf8aa9310cdc6723f6704.
          - A previous work-PC test build of PR #136 was quarantined by Microsoft Defender. That detection has not been classified or cleared on the affected machine; see [issue #137](https://github.com/dillacorn/win-glaze-dots/issues/137). Do not bypass organizational antivirus policy to install it.
          - Interactive Windows Start focus behavior still needs confirmation on an affected Windows session.
          WGDOT_RELEASE_NOTES
          gh release create "$release" --repo "$GH_REPO" --target "$RELEASE_SHA" --title "$title" --notes-file "$notes" --latest
          actual_release="$(gh api "repos/$GH_REPO/releases/tags/$release")"
          printf '%s\n' "$actual_release" | jq -e --arg title "$title" --arg sha "$RELEASE_SHA"             '.name == $title and .target_commitish == $sha and .draft == false and .prerelease == false' >/dev/null
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$release" --jq '.object.sha')" = "$RELEASE_SHA"
          expected_notes="$(cat "$notes")"
          published_notes="$(gh release view "$release" --repo "$GH_REPO" --json body --jq '.body')"
          test "$published_notes" = "$expected_notes"
          echo "Verified $release -> $RELEASE_SHA with exact notes and stable metadata."

  cleanup-v4-8-7-once:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.action == 'synchronize' &&
        github.event.pull_request.title == 'release-bridge: WGDot v4.8.7' &&
        github.event.pull_request.head.ref == 'chore/release-v4.8.7-power-menu' &&
        github.event.pull_request.head.repo.full_name == 'dillacorn/win-glaze-dots' &&
        github.event.pull_request.base.ref == 'main'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify release and remove unmerged temporary branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dillacorn/win-glaze-dots
          RELEASE_SHA: 559817bbe137b2094ddaf8aa9310cdc6723f6704
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GH_REPO/releases/tags/v4.8.7")"
          printf '%s\n' "$release" | jq -e --arg sha "$RELEASE_SHA" '.tag_name == "v4.8.7" and .target_commitish == $sha and .draft == false and .prerelease == false' >/dev/null
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v4.8.7" --jq '.object.sha')" = "$RELEASE_SHA"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/chore/release-v4.8.7-power-menu"
          echo "Verified v4.8.7 and deleted temporary release helper branch."
