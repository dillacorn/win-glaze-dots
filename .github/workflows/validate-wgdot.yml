name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  release-v460-post-update:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'Release bridge: update v4.6.0 post-release notes' &&
      github.event.pull_request.head.ref == 'release-bridge/v4.6.0-post-update' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v4.6.0
      RELEASE_NAME: WGDot v4.6.0 Yazi
      RELEASE_TARGET: 1b2a87f619e14a15fd29c52913372dd434691493
      POST_UPDATE_COMMIT: 5220b6c3773a643262854041cd6802db3b34ecae
    steps:
      - name: Update and verify the existing v4.6.0 release body
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,body > before.json
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$RELEASE_TARGET"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          before = json.loads(Path("before.json").read_text(encoding="utf-8"))
          expected = {
              "tagName": os.environ["RELEASE_TAG"],
              "name": os.environ["RELEASE_NAME"],
              "isDraft": False,
              "isPrerelease": False,
              "targetCommitish": os.environ["RELEASE_TARGET"],
          }
          for key, value in expected.items():
              if before.get(key) != value:
                  raise SystemExit(f"Unexpected release {key}: {before.get(key)!r}")

          marker = "## Post-release update - WGDot security hardening"
          body = before["body"]
          if marker in body:
              raise SystemExit("The v4.6.0 security post-update is already present.")

          commit = os.environ["POST_UPDATE_COMMIT"]
          section = f"""{marker}

          - On 2026-09-24, WGDot runtime security hardening from [PR #65](https://github.com/dillacorn/win-glaze-dots/pull/65) was merged to `main` at [`{commit[:7]}`](https://github.com/dillacorn/win-glaze-dots/commit/{commit}). Existing installs receive the updated runtime through WGDot's normal `main` self-refresh; no installation method, application selection, desktop behavior, or extra executable was added.
          - Elevated software and GPU handoffs now verify exact file bytes before use, elevated WinGet and DDU launches are restricted to validated absolute locations, and `wgdotw.exe` now preserves argument boundaries for paths and values containing spaces or quotes.
          - `wgdotw.exe` is rebuilt once because its frontend version changed. Enterprise application control may require approval for the new `wgdot.exe` and `wgdotw.exe` hashes.
          - The v4.6.0 tag and managed Yazi/config release target remain unchanged at `{os.environ['RELEASE_TARGET']}`; this post-release note documents the runtime hardening now on `main`.
          - `Validate WGDot` passed on PR #65. Real ThreatLocker and GPU Safe Mode/DDU behavior were not exercised by CI.
          """
          intended = body.rstrip() + "\n\n" + section
          Path("notes.md").write_text(intended, encoding="utf-8")
          Path("metadata.json").write_text(
              json.dumps({key: before[key] for key in expected}, sort_keys=True),
              encoding="utf-8",
          )
          PY

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,body > after.json

          python - <<'PY'
          import json
          from pathlib import Path

          after = json.loads(Path("after.json").read_text(encoding="utf-8"))
          intended = Path("notes.md").read_text(encoding="utf-8")
          expected_metadata = json.loads(Path("metadata.json").read_text(encoding="utf-8"))
          if after["body"] != intended:
              raise SystemExit("Published release body does not match the intended complete body.")
          actual_metadata = {key: after[key] for key in expected_metadata}
          if actual_metadata != expected_metadata:
              raise SystemExit("Release metadata changed during the body-only edit.")
          PY

          after_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$after_tag_sha" = "$RELEASE_TARGET"
