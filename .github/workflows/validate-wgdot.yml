name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  release-v4-7-1:
    name: Publish WGDot v4.7.1
    needs: [yasb-stable-schema, windows-powershell-51, powershell-7, native-bootstrap]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'release-bridge: WGDot v4.7.1' &&
      github.head_ref == 'release-bridge-v4.7.1' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create and verify v4.7.1
        shell: bash
        run: |
          set -Eeuo pipefail
          target='a4a93778de0ed4d93e40e6a9e42479bfa25f404b'
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$current_main" == "$target" ]] || {
            printf 'main moved: expected %s, got %s\n' "$target" "$current_main" >&2
            exit 1
          }

          if gh release view v4.7.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' 'v4.7.1 already exists; refusing to replace it.' >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v4.7.1" >/dev/null 2>&1; then
            printf '%s\n' 'v4.7.1 tag already exists; refusing to move or replace it.' >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/wgdot-v4.7.1.md"
          cat >"$notes" <<'EOF_NOTES'
          # WGDot v4.7.1
          
          Fixes Windows/Linux dual-boot clock drift with an opt-in UTC hardware-clock compatibility tweak.
          
          ## Install and update
          
          - [Install](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)
          - [Update](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)
          
          ## Changes
          
          - Added **Use UTC hardware clock (fix Windows/Linux dual-boot time)** under Windows tweaks / integrations.
          - The tweak is default OFF, administrator-level, and sets Windows' `RealTimeIsUniversal=1` RTC interpretation while preserving the prior registry state for rollback.
          - Enabling it requests a best-effort Windows Time resync and does not modify Linux, the selected Windows time zone, or unrelated time settings.
          
          ## Validation
          
          - The complete `Validate WGDot` workflow passed on exact release commit `a4a93778de0ed4d93e40e6a9e42479bfa25f404b`, including Windows PowerShell 5.1, PowerShell 7, YASB/schema and Yazi Lua checks, and native bootstrap/maintenance validation.
          - Maintainer runtime testing confirmed the clock remains correct after booting Arch Linux and returning to Windows.
          EOF_NOTES

          gh release create v4.7.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title 'WGDot v4.7.1' \
            --notes-file "$notes"

          actual_notes="$RUNNER_TEMP/wgdot-v4.7.1.actual.md"
          gh release view v4.7.1 --repo "$GITHUB_REPOSITORY" --json body --jq .body >"$actual_notes"
          python3 - "$notes" "$actual_notes" <<'PY_VERIFY_NOTES'
          from pathlib import Path
          import sys
          expected = Path(sys.argv[1]).read_text(encoding='utf-8').rstrip('\n')
          actual = Path(sys.argv[2]).read_text(encoding='utf-8').rstrip('\n')
          if actual != expected:
              raise SystemExit('published release body does not match intended notes')
          PY_VERIFY_NOTES

          release_json="$(gh release view v4.7.1 --repo "$GITHUB_REPOSITORY" --json name,tagName,isDraft,isPrerelease,targetCommitish)"
          [[ "$(jq -r .name <<<"$release_json")" == 'WGDot v4.7.1' ]]
          [[ "$(jq -r .tagName <<<"$release_json")" == 'v4.7.1' ]]
          [[ "$(jq -r .isDraft <<<"$release_json")" == 'false' ]]
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == 'false' ]]
          [[ "$(jq -r .targetCommitish <<<"$release_json")" == "$target" ]]
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v4.7.1" --jq .object.sha)"
          [[ "$tag_sha" == "$target" ]]

      - name: Remove helper branch after PR closes
        shell: bash
        run: |
          set -Eeuo pipefail
          pr='${{ github.event.pull_request.number }}'
          for _ in $(seq 1 120); do
            state="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr}" | jq -r .state)"
            if [[ "$state" == 'closed' ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/release-bridge-v4.7.1"
              exit 0
            fi
            sleep 5
          done
          printf '%s\n' 'Release is verified, but the helper PR was not closed before cleanup timeout.' >&2
          exit 1
