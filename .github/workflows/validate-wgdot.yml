name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  publish-v4-7-4-yazi-rename-one-use:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.repository == 'dillacorn/win-glaze-dots' &&
      github.event.pull_request.title == 'Release bridge v4.7.4 Yazi Rename one-use' &&
      github.event.pull_request.head.ref == 'chore/release-v4.7.4-yazi-rename-bridge-20261009' &&
      github.event.pull_request.head.repo.full_name == 'dillacorn/win-glaze-dots' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create and verify WGDot v4.7.4 Yazi Rename
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo="dillacorn/win-glaze-dots"
          target="e1475210ce4403f8af25d5b8f9b09dfbfe351ac7"
          tag="v4.7.4"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_REPOSITORY" = "$repo"
          test "$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")" = "Release bridge v4.7.4 Yazi Rename one-use"
          test "$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")" = "chore/release-v4.7.4-yazi-rename-bridge-20261009"
          test "$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")" = "$repo"
          test "$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")" = "main"
          main_sha="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$target" || { echo "Main SHA has changed: $main_sha" >&2; exit 1; }
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite." >&2
            exit 1
          fi
          if gh api "repos/$repo/git/ref/tags/$tag" --silent >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to overwrite." >&2
            exit 1
          fi
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          cat >"$notes" <<'RELEASE_NOTES'
          # WGDot v4.7.4 Yazi Rename
          
          This release makes Yazi filename editing more like Windows Explorer while keeping Yazi's native rename and file operations.
          
          ## Install and update
          
          - [Install](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)
          - [Update](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)
          
          ## Yazi improvements
          
          - Single-file Rename now permits native Windows Terminal mouse-drag text selection for copying with Ctrl+Shift+C and pasting with Ctrl+Shift+V.
          - Shift+Left/Right selects filename characters; Ctrl+Shift+Left/Right extends selection to the beginning/end of the input.
          - Ctrl+C copies Yazi-selected text, while Ctrl+V supports native input clipboard actions.
          - Cursor navigation automatically returns the rename field to insert mode so Ctrl+Shift+V works after text selection without closing and reopening Rename.
          - Exiting Rename through Esc or Enter restores terminal mouse capture, preserving clickable Yazi files. Native rename collision checks, bulk rename, and normal manager mouse actions remain intact.
          
          ## Validation
          
          - All four Validate WGDot jobs passed on PR #111 (Windows PowerShell 5.1, PowerShell 7, Yazi Lua/schema, and native bootstrap).
          - Maintainer Windows Terminal testing confirmed rename selection, copying/pasting in the same input, Ctrl+Shift+Arrow selection, and mouse interaction after cancelling with Esc.
          RELEASE_NOTES

          gh release create "$tag" --repo "$repo" --target "$target" \
            --title "WGDot v4.7.4 Yazi Rename" --notes-file "$notes" --latest

          gh release view "$tag" --repo "$repo" \
            --json tagName,name,isDraft,isPrerelease,body,targetCommitish,publishedAt \
            | jq -e --rawfile expected "$notes" --arg sha "$target" --arg tag "$tag" \
              '.tagName == $tag and .name == "WGDot v4.7.4 Yazi Rename" and .isDraft == false and .isPrerelease == false and .targetCommitish == $sha and .publishedAt != null and (.body | sub("\\n+$"; "")) == ($expected | sub("\\n+$"; ""))'
          released_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
          test "$released_sha" = "$target"
          echo "Verified published stable release $tag at $target"

  retire-v4-7-4-yazi-rename-one-use:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.repository == 'dillacorn/win-glaze-dots' &&
      github.event.pull_request.title == 'Release bridge v4.7.4 Yazi Rename one-use' &&
      github.event.pull_request.head.ref == 'chore/release-v4.7.4-yazi-rename-bridge-20261009' &&
      github.event.pull_request.head.repo.full_name == 'dillacorn/win-glaze-dots' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify release then delete disposable helper branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo="dillacorn/win-glaze-dots"
          target="e1475210ce4403f8af25d5b8f9b09dfbfe351ac7"
          release_json="$(gh api "repos/$repo/releases/tags/v4.7.4")"
          jq -e --arg sha "$target" \
            '.tag_name == "v4.7.4" and .name == "WGDot v4.7.4 Yazi Rename" and .draft == false and .prerelease == false and .target_commitish == $sha and (.body | startswith("# WGDot v4.7.4 Yazi Rename\\n"))' <<<"$release_json"
          test "$(gh api "repos/$repo/git/ref/tags/v4.7.4" --jq '.object.sha')" = "$target"
          test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$target"
          gh api -X DELETE "repos/$repo/git/refs/heads/chore/release-v4.7.4-yazi-rename-bridge-20261009"
          echo "Release verified and disposable helper branch deleted without merging"
# One-use release verified; synchronize event retires this helper branch.
