name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  release-v461-yazi:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'Create WGDot v4.6.1 Yazi release' &&
      github.event.pull_request.head.ref == 'chore/v461-yazi-release-bridge' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and verify WGDot v4.6.1 Yazi
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag='v4.6.1'
          title='WGDot v4.6.1 Yazi'
          target='0a60dd464ba88f2a97eb4866c77f25be9a6de0eb'

          release_exists=0
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=1
          elif git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a published release." >&2
            exit 1
          fi

          cat > release-notes.md <<'EOF'
          # WGDot v4.6.1 Yazi

          WGDot v4.6.1 is a Yazi-focused bug-fix and polish release following the larger v4.6.0 update.

          ## Install and update

          - **Install:** [INSTALL.md](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)
          - **Update:** [UPDATE.md](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)

          ## Yazi

          - Fixes Windows `Ctrl+C` file copy reliability. Yazi and Windows Terminal now keep the copy chord routed correctly, and the managed bookmark/recent-file plugins no longer use Lua shell-spawn APIs that could interfere with Windows console signals.
          - `Ctrl+C` and `c y` copy through the same tested Windows FileDrop path, with a concise Yazi success notification after the Windows clipboard operation completes.
          - Up/Down now wrap around the file list: Up from the first item goes to the bottom and Down from the last item returns to the top.
          - `F2` now renames the highlighted item.
          - Enter remains context-aware: directories enter inside Yazi and files open normally.
          - Esc keeps Yazi's native one-layer-at-a-time cancellation behavior, so active modes/commands cancel before selection is cleared.
          - Includes the post-v4.6.0 outbound drag update: `d g` and **Drag out...** open the themed native FileDrop surface while normal internal drag remains Yazi Copy/Move.

          ## Other fixes

          - Managed Yazi updates no longer require terminating running Yazi sessions; updated sessions can be restarted when convenient.
          - RawAccel login startup prefers its bundled headless writer path instead of leaving the GUI resident.
          - Removes obsolete repository-root legacy scripts and their superseded copy guide.

          ## Validation

          - Exact release target: `0a60dd464ba88f2a97eb4866c77f25be9a6de0eb`.
          - PR #69 passed all four WGDot exact-head validation jobs before merge.
          - The maintainer runtime-tested the final Windows Yazi behavior, including `Ctrl+C`, `c y`, Enter on files/folders, F2 rename, and file-list wraparound.

          ## Post-release updates

          _Placeholder for possible tested post-release patches to v4.6.1._
          EOF

          if [[ "$release_exists" == 0 ]]; then
            gh release create "$tag" \
              --target "$target" \
              --title "$title" \
              --notes-file release-notes.md
          fi

          published="$(gh release view "$tag" --json name,tagName,isDraft,isPrerelease,targetCommitish,body)"
          printf '%s\n' "$published"

          test "$(printf '%s' "$published" | jq -r '.name')" = "$title"
          test "$(printf '%s' "$published" | jq -r '.tagName')" = "$tag"
          test "$(printf '%s' "$published" | jq -r '.isDraft')" = "false"
          test "$(printf '%s' "$published" | jq -r '.isPrerelease')" = "false"
          test "$(printf '%s' "$published" | jq -r '.targetCommitish')" = "$target"
          printf '%s' "$published" | jq -j '.body' > published-release-notes.md
          cmp -s release-notes.md published-release-notes.md

          tag_sha="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          test "$tag_sha" = "$target"

  cleanup-v461-release-bridge:
    needs:
      - yasb-stable-schema
      - windows-powershell-51
      - powershell-7
      - native-bootstrap
      - release-v461-yazi
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'Create WGDot v4.6.1 Yazi release' &&
      github.event.pull_request.head.ref == 'chore/v461-yazi-release-bridge' &&
      github.event.pull_request.base.ref == 'main' &&
      needs.yasb-stable-schema.result == 'success' &&
      needs.windows-powershell-51.result == 'success' &&
      needs.powershell-7.result == 'success' &&
      needs.native-bootstrap.result == 'success' &&
      needs.release-v461-yazi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Close bridge PR and delete helper branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr close "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/chore/v461-yazi-release-bridge"
