name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test


  v460-yazi-post-release-bridge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'Temporary v4.6.0 Yazi post-release bridge' &&
      github.event.pull_request.head.ref == 'chore/v460-yazi-post-release-bridge' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update and verify existing v4.6.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo='dillacorn/win-glaze-dots'
          tag='v4.6.0'
          title='WGDot v4.6.0 Yazi'
          expected_release_target='1b2a87f619e14a15fd29c52913372dd434691493'
          expected_main='5103f4284ccaa5b11975d36fe0a8b9719808c4a9'
          branch='chore/v460-yazi-post-release-bridge'
          before="$RUNNER_TEMP/v460-before.json"
          after="$RUNNER_TEMP/v460-after.json"
          proposed="$RUNNER_TEMP/v460-proposed.md"

          gh api "repos/$repo/releases/tags/$tag" >"$before"

          python3 - "$before" "$proposed" <<'PY'
          import json
          from pathlib import Path
          import sys

          before = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          proposed_path = Path(sys.argv[2])

          expected = {
              "name": "WGDot v4.6.0 Yazi",
              "tag_name": "v4.6.0",
              "target_commitish": "1b2a87f619e14a15fd29c52913372dd434691493",
              "draft": False,
              "prerelease": False,
          }
          actual = {key: before.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f"unexpected v4.6.0 release metadata: {actual!r}")

          body = before.get("body") or ""
          heading = "## Post-release update - Yazi outbound drag and startup polish"
          if heading in body:
              raise SystemExit("v4.6.0 Yazi/startup post-release section already exists")

          install = "[INSTALL.md](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)"
          update = "[UPDATE.md](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)"
          if "## Install and update" not in body or install not in body or update not in body:
              raise SystemExit("existing v4.6.0 body is missing the required install/update contract")
          if body.index(install) > body.index(update):
              raise SystemExit("existing v4.6.0 body has Update before Install")

          section = """## Post-release update - Yazi outbound drag and startup polish

          - On 2026-09-24, Yazi outbound drag from PR #67 was merged to `main` at `5103f4284ccaa5b11975d36fe0a8b9719808c4a9`. `d g` and right-click **Drag out...** now open a compact native Windows FileDrop surface for the hovered item or current selection.
          - The drag surface is borderless, follows the active WGDot/YASB theme, opens centered on the active interaction screen, supports multi-selection, and keeps Yazi's internal mouse drag as its existing Copy/Move workflow. It does not mutate the clipboard, inject keys, install hooks, or track pointer escape from the terminal.
          - Managed Yazi configuration updates no longer require Yazi to be closed. WGDot applies the managed files normally and prints a restart notice so existing sessions can reload the new configuration when convenient.
          - RawAccel login startup now prefers RawAccel's bundled `writer.exe settings.json` path so the saved driver configuration is applied without leaving a GUI or taskbar window resident. `Super+Shift+M` remains the explicit path for opening the visible, centered RawAccel GUI.
          - The maintainer runtime-approved the Yazi drag/drop, theme-following, and centered-window behavior before merge. `Validate WGDot` passed on the exact PR head and again on the post-merge `main` commit. The final headless RawAccel writer path is CI-validated and was not separately runtime-tested after that last refinement.
          - The v4.6.0 tag and original managed release target remain unchanged at `1b2a87f619e14a15fd29c52913372dd434691493`."""

          if body.endswith("\n\n"):
              separator = ""
          elif body.endswith("\n"):
              separator = "\n"
          else:
              separator = "\n\n"

          intended = body + separator + section
          proposed_path.write_text(intended, encoding="utf-8")
          PY

          tag_sha_before="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [[ "$tag_sha_before" != "$expected_release_target" ]]; then
            printf 'Unexpected %s tag SHA before edit: %s\n' "$tag" "$tag_sha_before" >&2
            exit 1
          fi

          main_sha_before="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$main_sha_before" != "$expected_main" ]]; then
            printf 'Unexpected main SHA before release edit: %s\n' "$main_sha_before" >&2
            exit 1
          fi

          gh release edit "$tag" --repo "$repo" --notes-file "$proposed"
          gh api "repos/$repo/releases/tags/$tag" >"$after"

          python3 - "$before" "$after" "$proposed" <<'PY'
          import json
          from pathlib import Path
          import sys

          before = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          after = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          intended = Path(sys.argv[3]).read_text(encoding="utf-8")

          keys = ("name", "tag_name", "target_commitish", "draft", "prerelease")
          before_meta = {key: before.get(key) for key in keys}
          after_meta = {key: after.get(key) for key in keys}
          if after_meta != before_meta:
              raise SystemExit(
                  f"release metadata changed unexpectedly: {before_meta!r} -> {after_meta!r}"
              )

          published = after.get("body") or ""
          if published != intended:
              raise SystemExit("published v4.6.0 body does not exactly match the intended body")

          old_body = before.get("body") or ""
          if not published.startswith(old_body):
              raise SystemExit("existing v4.6.0 release notes were not preserved verbatim")

          if published.count("## Post-release update - Yazi outbound drag and startup polish") != 1:
              raise SystemExit("expected exactly one Yazi/startup post-release section")

          install = "[INSTALL.md](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)"
          update = "[UPDATE.md](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)"
          if not published.startswith("# WGDot v4.6.0 Yazi"):
              raise SystemExit("published body lost the v4.6.0 release heading")
          if "## Install and update" not in published or install not in published or update not in published:
              raise SystemExit("published body lost the required install/update contract")
          if published.index(install) > published.index(update):
              raise SystemExit("published body has Update before Install")
          PY

          tag_sha_after="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [[ "$tag_sha_after" != "$tag_sha_before" ]]; then
            printf 'Release tag moved unexpectedly: %s -> %s\n' "$tag_sha_before" "$tag_sha_after" >&2
            exit 1
          fi

          main_sha_after="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$main_sha_after" != "$expected_main" ]]; then
            printf 'main moved during release edit: %s -> %s\n' "$expected_main" "$main_sha_after" >&2
            exit 1
          fi

          printf 'Verified %s post-release notes; tag remains %s.\n' "$tag" "$tag_sha_after"

          gh pr close "${{ github.event.pull_request.number }}" --repo "$repo" --comment 'v4.6.0 Yazi post-release notes updated and verified. Closing this temporary release bridge without merge.'
          git push origin --delete "$branch"
