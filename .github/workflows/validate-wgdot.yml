name: Validate WGDot

on:
  workflow_dispatch:
  push:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"
  pull_request:
    paths:
      - "wgdot/**"
      - "i.ps1"
      - "tests/test-wgdot.ps1"
      - "tests/test-yasb-config.py"
      - "tests/test-yazi-config.py"
      - "tests/test-yasb-parity.ps1"
      - "tests/test-desktop-*"
      - "UserProfile/.config/yasb/**"
      - "UserProfile/.glzr/glazewm/**"
      - "UserProfile/AppData/Roaming/yazi/**"
      - "MANUAL_POWERSHELL.md"
      - "INSTALL.md"
      - "UPDATE.md"
      - "AGENTS.md"
      - ".github/workflows/validate-wgdot.yml"

permissions:
  contents: read

jobs:
  yasb-stable-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable YASB release
        id: yasb
        shell: bash
        run: |
          tag="$(curl -fsSL https://api.github.com/repos/amnweb/yasb/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validating against YASB $tag"
      - uses: actions/checkout@v4
        with:
          repository: amnweb/yasb
          ref: ${{ steps.yasb.outputs.tag }}
          path: upstream-yasb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check "pydantic==2.13.4" "PyYAML==6.0.3"
      - name: Validate managed YASB config against upstream stable schemas
        run: python tests/test-yasb-config.py upstream-yasb
      - name: Install Yazi Lua validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate managed Yazi config syntax
        run: |
          python tests/test-yazi-config.py
          find UserProfile/AppData/Roaming/yazi/config -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Validate desktop launcher ownership
        run: python tests/test-desktop-bindings.py

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-wgdot.ps1
      - name: Validate YASB parity with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-yasb-parity.ps1
      - name: Validate desktop integration contracts
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -File tests\test-desktop-contracts.ps1

  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-wgdot.ps1
      - name: Validate YASB parity with PowerShell 7
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/test-yasb-parity.ps1

  native-bootstrap:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only bootstrap outside repository
        shell: cmd
        run: copy /Y wgdot\bootstrap.cmd "%TEMP%\wgdot-bootstrap-test.cmd"
      - name: Install from arbitrary directory using exact revision
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
      - name: Verify installed native command
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          if not exist "%LOCALAPPDATA%\wgdot\bin\wgdotw.exe" exit /b 1
      - name: Reinstall exact runtime through PowerShell WebClient fallback
        shell: cmd
        env:
          WGDOT_FORCE_POWERSHELL_DOWNLOAD: "1"
        run: |
          cd /d "%TEMP%"
          call wgdot-bootstrap-test.cmd --ref "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }} --no-launch
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
      - name: Validate raw-only exact revision source acquisition
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" source-self-test --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate restricted-network dots-only planning
        shell: cmd
        env:
          WGDOT_FORCE_RAW_SOURCE: "1"
          WGDOT_SKIP_RUNTIME_REFRESH: "1"
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" dots-only --profile work > "%TEMP%\wgdot-dots-only-plan.txt"
          type "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"GlazeWM profile: work" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Software operations: disabled" "%TEMP%\wgdot-dots-only-plan.txt"
          findstr /C:"Review only. No managed files, backups, baselines, or selection state were changed." "%TEMP%\wgdot-dots-only-plan.txt"
      - name: Validate automatic runtime refresh handoff
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" mark-runtime --ref "${{ github.head_ref || github.ref_name }}" --revision 0000000000000000000000000000000000000001
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" status
          ping 127.0.0.1 -n 4 >nul
          findstr /C:"${{ github.event.pull_request.head.sha || github.sha }}" "%LOCALAPPDATA%\wgdot\state\native-bootstrap.json"
      - name: Verify persistent user PATH
        shell: cmd
        run: |
          reg query HKCU\Environment /v Path | findstr /I /C:"wgdot\bin"
      - name: Seed non-mutating Git review selection
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\wgdot\state" mkdir "%LOCALAPPDATA%\wgdot\state"
          >"%LOCALAPPDATA%\wgdot\state\installation.json" echo {"scope":"normal","glazewmProfile":"normal","components":["glazewm","yazi"],"packages":[]}
      - name: Validate native Git review planner
        shell: cmd
        run: |
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" git-review --branch "${{ github.head_ref || github.ref_name }}" --revision ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate native maintenance mutations in isolated state
        shell: cmd
        run: |
          set "WGDOT_TEST_ROOT=%TEMP%\wgdot-native-maintenance-state"
          "%LOCALAPPDATA%\wgdot\bin\wgdot.exe" maintenance-self-test

  release-v4-6-2-yazi:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == 'TEMP publish WGDot v4.6.2 Yazi' &&
      github.event.pull_request.head.ref == 'release/v4.6.2-yazi' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v4.6.2
      RELEASE_TITLE: WGDot v4.6.2 Yazi
      RELEASE_TARGET: 540343b24944811aa9a6953ef134b7dc7e6820cd
      PREVIOUS_TAG: v4.6.1
    steps:
      - uses: actions/checkout@v4

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

          gh release view "${PREVIOUS_TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q .body > /tmp/previous-release.md

          python3 - <<'PY'
          notes = """# WGDot v4.6.2 Yazi

          WGDot v4.6.2 folds the tested post-v4.6.1 Yazi and runtime work into the stable release stream so `wgdot update` installs the approved configuration.

          ## Install and update

          - **Install:** [INSTALL.md](https://github.com/dillacorn/win-glaze-dots/blob/main/INSTALL.md)
          - **Update:** [UPDATE.md](https://github.com/dillacorn/win-glaze-dots/blob/main/UPDATE.md)

          ## Yazi

          - Restores the proven custom Lua `Modal` right-click menu with directly clickable item, folder, and blank-space actions while leaving upstream Root click/layout routing untouched.
          - `b` toggles Bookmarks and returns to the exact per-tab source directory; `B` bookmarks/unbookmarks the highlighted item.
          - `r` toggles Recents and returns to the exact per-tab source directory; `R` renames, with `F2` retained as an alias.
          - `g b` and `g r` remain explicit Go commands; the old `g B` bookmark-mutation binding is removed.
          - The v4.6.1 Yazi copy, wraparound navigation, Enter/Esc, and outbound drag fixes remain included.

          ## WGDot runtime

          - Git-testing/runtime refresh compiles now use unique staged executable names so Windows cannot block an update by locking the currently running revision-named executable.
          - A pending Git-testing runtime replacement is protected from a competing outer staged-runtime replacement.

          ## Validation

          - Exact release target: `540343b24944811aa9a6953ef134b7dc7e6820cd`.
          - PR #75 passed all four WGDot validation jobs before merge.
          - The maintainer runtime-tested the final Windows custom right-click menu and approved the final Yazi behavior.

          ## Post-release updates

          _Placeholder for possible tested post-release patches to v4.6.2._
          """
          notes = "\n".join(line[10:] if line.startswith("          ") else line for line in notes.splitlines()) + "\n"
          open("/tmp/release-notes.md", "w", encoding="utf-8", newline="\n").write(notes)
          PY

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_TARGET}" \
            --title "${RELEASE_TITLE}" \
            --notes-file /tmp/release-notes.md

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > /tmp/release.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /tmp/tag.json

          python3 - <<'PY'
          import json, os
          release = json.load(open("/tmp/release.json", encoding="utf-8"))
          tag = json.load(open("/tmp/tag.json", encoding="utf-8"))
          body = release["body"]
          assert release["tag_name"] == os.environ["RELEASE_TAG"]
          assert release["name"] == os.environ["RELEASE_TITLE"]
          assert release["draft"] is False
          assert release["prerelease"] is False
          assert release["target_commitish"] == os.environ["RELEASE_TARGET"]
          assert "## Validation" in body
          assert "540343b24944811aa9a6953ef134b7dc7e6820cd" in body
          assert tag["object"]["type"] == "commit"
          assert tag["object"]["sha"] == os.environ["RELEASE_TARGET"]
          print("PASS: WGDot v4.6.2 release and tag target verified.")
          PY

      - name: Remove one-use helper branch
        if: success()
        shell: bash
        run: git push origin --delete "${{ github.head_ref }}"

